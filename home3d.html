function mk(id,it){
 const c=CATM[it.t];if(!c)return;if(IM[id])root.remove(IM[id]);
 curDrop=it.dr||.38;
 G=new THREE.Group();c.f();
 G.traverse(m=>{
  const s=m.userData.s;
  if(s){
   const hex=s==1?(it.c1||c.c1):(it.c2||c.c2);
   m.material.color.set(hex);
   if(hex==='#d4af37'||hex==='#c0c0c0'||it.t.startsWith('chand')||it.t==='fridge'){m.material.metalness=.65;m.material.roughness=.22}
  }
 });
 G.position.set(it.x,CEIL_MOUNT.has(it.t)?0:(it.y||0),it.z);
 G.rotation.y=it.r||0;G.scale.set(it.sx||1,it.sy||1,it.sz||1);G.userData={iid:id,j:JSON.stringify(it)};root.add(G);IM[id]=G;
 if(PH[id])photo(id,PH[id]);if(sel==id)hl();light();
}

function light(){
 if(!S.background)S.background=new THREE.Color(0xd7eaf8);
 if(ambMode===0){
  S.background.set(0xd7eaf8);hemi.color.set(0xffffff);hemi.groundColor.set(0x998877);hemi.intensity=.78;
  sun.color.set(0xfff4e0);sun.intensity=1.08;sun.position.set(14,24,10);$('dn').textContent='☀️ نهار';
 }else if(ambMode===1){
  S.background.set(0x3d1628);hemi.color.set(0xffb899);hemi.groundColor.set(0x59253a);hemi.intensity=.64;
  sun.color.set(0xff8c66);sun.intensity=.85;sun.position.set(4,9,14);$('dn').textContent='🌅 غروب';
 }else{
  S.background.set(0x0b0e1a);hemi.color.set(0xdde0ff);hemi.groundColor.set(0x221a24);hemi.intensity=.28;
  sun.color.set(0x8899cc);sun.intensity=.08;$('dn').textContent='🌙 ليل';
 }
 for(const id in IM)IM[id].traverse(o=>{if(o.isPointLight)o.intensity=(ambMode>0)&&(D.items[id]||{}).on!==0?1.05*o.userData.k:0});
 updateCeilingVisibility();
}

function apply(){
 for(const id in IM)if(!D.items[id]){root.remove(IM[id]);delete IM[id];if(sel==id){sel=null;hl();showSel()}}
 for(const id in D.items){const j=JSON.stringify(D.items[id]);if(!IM[id]||IM[id].userData.j!==j)mk(id,D.items[id])}
 WALLS.forEach(w=>{const j=JSON.stringify(D.walls[w[0]]||0);if(WJ[w[0]]!==j){WJ[w[0]]=j;buildWall(w)}});
 Z.forEach(z=>{
  const j=D.floors[z[0]]||'';if(FJ[z[0]]!==j||!FL[z[0]]){FJ[z[0]]=j;buildFloor(z)}
  const cj=JSON.stringify((D.ceilings&&D.ceilings[z[0]])||{});if(CJ[z[0]]!==cj||!CL[z[0]]){CJ[z[0]]=cj;buildCeiling(z)}
 });
 light();if($('nb').style.display=='block')nb()}
function saveLocal(){try{localStorage.setItem('house3d_slot_'+slot,JSON.stringify(D))}catch(e){}}
function loadLocal(){try{const s=localStorage.getItem('house3d_slot_'+slot);if(s){const v=JSON.parse(s);D={items:v.items||{},walls:v.walls||{},floors:v.floors||{},ceilings:v.ceilings||{},palette:v.palette||[]}}}catch(e){}}
function put(path,val){const p=path.split('/');let o=D;for(let i=0;i<p.length-1;i++)o=o[p[i]]=o[p[i]]||{};if(val===null)delete o[p[p.length-1]];else o[p[p.length-1]]=val;
 saveLocal();if(ref)ref.child(path).set(val);hist.push(JSON.stringify(D));if(hist.length>31)hist.shift();redo=[];apply()}
function listen(){if(ref)ref.off();hist=[];redo=[];loadLocal();if(!hist.length)hist.push(JSON.stringify(D));apply();
 if(!db)return;ref=db.ref(ROOT+'designs/'+slot);

 const pan=(a,b)=>{const k=cam.r*.0016,c=Math.cos(cam.az),s=Math.sin(cam.az);cam.tx-=c*a*k+s*b*k;cam.tz+=s*a*k-c*b*k};
 if(PT.size==2){const [a,b]=[...PT.values()],d=Math.hypot(a.x-b.x,a.y-b.y),m={x:(a.x+b.x)/2,y:(a.y+b.y)/2};if(mode=='orbit'){cam.r=Math.min(60,Math.max(3,cam.r*pd/d));pan(m.x-pm.x,m.y-pm.y)}pd=d;pm=m;return}

let rep=null,CMAP={};

 s.forEach(c=>{const m=c.val(),me=m.u===ME;CMAP[c.key]=m;h+=`<div class="m ${me?'me':'you'}" data-k="${c.key}"${me?'':` data-a="rx" data-v="${c.key}"`}>${m.rp?`<div class="rq"><b>${esc(m.rp.u)}</b>${esc(m.rp.t)}</div>`:''}${me?'':`<small>${esc(m.u)}</small>`}${esc(m.t)}<span class="ri" data-a="rep" data-v="${c.key}">↩</span>${m.r?`<span class="rx">${m.r}</span>`:''}</div>`});
 el.innerHTML=h;if(low){el.scrollTop=el.scrollHeight;el.dataset.i=1}})}

{const a=$('msgs');let x0,y0,el=null,dx=0,sw=false;
 a.addEventListener('touchstart',e=>{el=e.target.closest('[data-k]');if(!el)return;x0=e.touches[0].clientX;y0=e.touches[0].clientY;dx=0;sw=false},{passive:true});
