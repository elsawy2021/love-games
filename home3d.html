function mk(id,it){const c=CATM[it.t];if(!c)return;if(IM[id])root.remove(IM[id]);G=new THREE.Group();c.f();
 G.traverse(m=>{const s=m.userData.s;if(s)m.material.color.set(s==1?(it.c1||c.c1):(it.c2||c.c2))});
 G.position.set(it.x,it.y||0,it.z);G.rotation.y=it.r||0;G.scale.set(it.sx||1,it.sy||1,it.sz||1);G.userData={iid:id,j:JSON.stringify(it)};root.add(G);IM[id]=G;
 if(PH[id])photo(id,PH[id]);if(sel==id)hl();light()}
function light(){S.background.set(night?0x0b1020:0xcfe3f3);hemi.intensity=night?.18:.7;sun.intensity=night?.05:.9;
 for(const id in IM)IM[id].traverse(o=>{if(o.isPointLight)o.intensity=night&&(D.items[id]||{}).on!==0?.9*o.userData.k:0});$('dn').textContent=night?'☀️':'🌙'}
function apply(){
 for(const id in IM)if(!D.items[id]){root.remove(IM[id]);delete IM[id];if(sel==id){sel=null;hl();showSel()}}
 for(const id in D.items){const j=JSON.stringify(D.items[id]);if(!IM[id]||IM[id].userData.j!==j)mk(id,D.items[id])}
 WALLS.forEach(w=>{const j=JSON.stringify(D.walls[w[0]]||0);if(WJ[w[0]]!==j){WJ[w[0]]=j;buildWall(w)}});
 Z.forEach(z=>{const j=D.floors[z[0]]||'';if(FJ[z[0]]!==j||!FL[z[0]]){FJ[z[0]]=j;buildFloor(z)}});
 light();if($('nb').style.display=='block')nb()}
function saveLocal(){try{localStorage.setItem('house3d_slot_'+slot,JSON.stringify(D))}catch(e){}}
function loadLocal(){try{const s=localStorage.getItem('house3d_slot_'+slot);if(s){const v=JSON.parse(s);D={items:v.items||{},walls:v.walls||{},floors:v.floors||{}}}}catch(e){}}
function put(path,val){const p=path.split('/');let o=D;for(let i=0;i<p.length-1;i++)o=o[p[i]]=o[p[i]]||{};if(val===null)delete o[p[p.length-1]];else o[p[p.length-1]]=val;
 saveLocal();if(ref)ref.child(path).set(val);hist.push(JSON.stringify(D));if(hist.length>31)hist.shift();redo=[];apply()}
function listen(){if(ref)ref.off();hist=[];redo=[];loadLocal();if(!hist.length)hist.push(JSON.stringify(D));apply();
 if(!db)return;ref=db.ref(ROOT+'designs/'+slot);
 ref.on('value',s=>{const v=s.val();if(v){D={items:v.items||{},walls:v.walls||{},floors:v.floors||{}};saveLocal()}if(!hist.length)hist.push(JSON.stringify(D));apply()})}
function undo(){if(hist.length<2)return;redo.push(hist.pop());D=JSON.parse(hist[hist.length-1]);saveLocal();if(ref)ref.set(D);apply()}
function redoF(){if(!redo.length)return;const s=redo.pop();hist.push(s);D=JSON.parse(s);saveLocal();if(ref)ref.set(D);apply()}
function hl(){if(bh){S.remove(bh);bh=null}if(sel&&IM[sel]){bh=new THREE.BoxHelper(IM[sel],0xffd166);S.add(bh)}}
function photo(id,url){PH[id]=url;const g=IM[id];if(!g)return;const im=new Image();im.onload=()=>g.traverse(m=>{if(m.userData.img){const t=new THREE.Texture(im);t.encoding=THREE.sRGBEncoding;t.needsUpdate=true;m.material.map=t;m.material.color.set('#fff');m.material.needsUpdate=true}});im.src=url}

 const sl=(k,l,a,b,v)=>`<label>${l}<input type="range" data-k="${k}" min="${a}" max="${b}" step=".05" value="${v}"></label>`;

 s.forEach(c=>{const m=c.val(),me=m.u===ME;CMAP[c.key]=m;h+=`<div class="m ${me?'me':'you'}" data-k="${c.key}"${me?'':` data-a="rx" data-v="${c.key}"`}>${m.rp?`<div class="rq"><b>${esc(m.rp.u)}</b>${esc(m.rp.t)}</div>`:''}${me?'':`<small>${esc(m.u)}</small>`}${esc(m.t)}<span class="ri" data-a="rep" data-v="${c.key}">↩</span>${m.r?`<span class="rx">${m.r}</span>`:''}</div>`});

{const a=$('msgs');let x0,y0,el=null,dx=0,sw=false;
